# =============================================================================
# Group Variables — Applied to ALL hosts (non-secret values)
# =============================================================================
# Secrets are stored in vault.yml (encrypted with ansible-vault).
# =============================================================================
---

# ---------- Kubernetes version -----------------------------------------------
kube_version: "1.29.2-1.1"
kube_major_version: "1.29"

# ---------- Networking -------------------------------------------------------
pod_network_cidr: "10.244.0.0/16"
master_ip: "192.168.56.10"

# ---------- Kubernetes APT repository ----------------------------------------
kube_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v{{ kube_major_version }}/deb/Release.key"
kube_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kube_major_version }}/deb/ /"

# ---------- Flannel CNI manifest ---------------------------------------------
flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"

# ---------- Common prerequisite packages --------------------------------------
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common
  - nfs-common

# ---------- Node hostnames & IPs (for /etc/hosts) ----------------------------
cluster_hosts:
  - { hostname: "k8s-master",  ip: "192.168.56.10" }
  - { hostname: "k8s-worker1", ip: "192.168.56.11" }
  - { hostname: "k8s-worker2", ip: "192.168.56.12" }
  - { hostname: "services",    ip: "192.168.56.20" }

# =============================================================================
# Services VM — NFS, Docker, Gitea, Nexus
# =============================================================================

# ---------- NFS server -------------------------------------------------------
nfs_export_path: "/srv/nfs"
nfs_exports:
  - name: mysql-data
    path: "/srv/nfs/mysql-data"
  - name: jenkins-data
    path: "/srv/nfs/jenkins-data"
  - name: todo-postgres-data
    path: "/srv/nfs/todo-postgres-data"
nfs_allowed_network: "192.168.56.0/24"

# ---------- Services VM IP ---------------------------------------------------
services_ip: "192.168.56.20"

# ---------- Gitea (self-hosted Git server) -----------------------------------
gitea_http_port: 3000
gitea_ssh_port: 2222
gitea_data_dir: "/opt/gitea"

# ---------- Nexus (Docker image registry) ------------------------------------
nexus_http_port: 8081
nexus_docker_port: 8082
nexus_data_dir: "/opt/nexus"
nexus_admin_user: "admin"
nexus_admin_password: "{{ vault_nexus_admin_password }}"

# ---------- Helm -------------------------------------------------------------
helm_version: "v3.14.2"

# ---------- Jenkins (CI/CD server) -------------------------------------------
jenkins_http_port: 8080
jenkins_namespace: "jenkins"
jenkins_nodeport: 30080
jenkins_storage_size: "8Gi"
jenkins_nfs_path: "/srv/nfs/jenkins-data"
jenkins_chart_version: ""

# ---------- NGINX Ingress Controller -----------------------------------------
ingress_namespace: "ingress-nginx"
ingress_http_nodeport: 31080
ingress_https_nodeport: 31443

# ---------- Todo application -------------------------------------------------
todo_namespace: "todo-app"
