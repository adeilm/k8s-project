# =============================================================================
# Role: master — Initialize the Kubernetes control plane
# =============================================================================
# Runs kubeadm init (only if not already initialized), configures kubectl for
# the vagrant user, and extracts the worker join command for dynamic use.
# =============================================================================
---

# ---------- 1. Check if the cluster is already initialized --------------------
- name: Check if Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

# ---------- 2. Initialize the control plane -----------------------------------
- name: Run kubeadm init
  ansible.builtin.command: >
    kubeadm init
    --apiserver-advertise-address={{ master_ip }}
    --pod-network-cidr={{ pod_network_cidr }}
    --node-name={{ inventory_hostname }}
  when: not kubeadm_init_check.stat.exists
  register: kubeadm_init_result

# ---------- 2b. Patch kube-proxy to use host-only IP (dual-NIC fix) -----------
# kubeadm generates kube-proxy's kubeconfig using the default-route interface
# (10.0.2.15 on Vagrant NAT), not --apiserver-advertise-address. Without this,
# kube-proxy can't reach the API, Flannel crashes, and workers stay NotReady.
- name: Patch kube-proxy ConfigMap to use master_ip
  ansible.builtin.shell: |
    kubectl -n kube-system get cm kube-proxy -o yaml \
      | sed 's|server: https://.*:6443|server: https://{{ master_ip }}:6443|' \
      | kubectl apply -f -
    kubectl -n kube-system rollout restart ds/kube-proxy
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init_check.stat.exists
  changed_when: true

# ---------- 2c. Patch CoreDNS for external DNS + IPv4-only ---------------------
# Two fixes baked into one ConfigMap:
#   1. forward . 8.8.8.8 1.1.1.1
#      Default forwards to /etc/resolv.conf which on Ubuntu 22.04 points at the
#      systemd-resolved stub 127.0.0.53 — unreachable from a Pod. Pods cannot
#      resolve external hostnames (Docker Hub, etc.).
#   2. template ANY AAAA . { rcode NOERROR }
#      Cluster has no IPv6 routing (Flannel + Vagrant are IPv4-only). When DNS
#      returns AAAA records, Go-based clients (Kaniko) try IPv6 first and hang.
#      Stripping AAAA forces every lookup to use IPv4.
- name: Patch CoreDNS Corefile (external DNS + drop AAAA)
  ansible.builtin.shell: |
    kubectl -n kube-system create configmap coredns \
      --from-literal=Corefile="$(printf '.:53 {\n    errors\n    health {\n       lameduck 5s\n    }\n    ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n       pods insecure\n       fallthrough in-addr.arpa ip6.arpa\n       ttl 30\n    }\n    template ANY AAAA . {\n       rcode NOERROR\n    }\n    prometheus :9153\n    forward . 8.8.8.8 1.1.1.1 {\n       max_concurrent 1000\n    }\n    cache 30\n    loop\n    reload\n    loadbalance\n}\n')" \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n kube-system rollout restart deploy/coredns
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init_check.stat.exists
  changed_when: true

# ---------- 3. Configure kubectl for the vagrant user -------------------------
- name: Create .kube directory for vagrant user
  ansible.builtin.file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Copy admin.conf to vagrant user's .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: "0600"

# ---------- 4. Generate and store the join command ----------------------------
- name: Generate cluster join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_result
  changed_when: false

- name: Store join command as a host fact
  ansible.builtin.set_fact:
    kube_join_command: "{{ join_command_result.stdout }}"

# ---------- 5. Debug — print join command (for verification) ------------------
- name: Display join command
  ansible.builtin.debug:
    msg: "{{ kube_join_command }}"
