# =============================================================================
# Role: master — Initialize the Kubernetes control plane
# =============================================================================
---

# ---------- 1. Check if the cluster is already initialized --------------------
- name: Check if Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

# ---------- 2. Write kubeadm config file --------------------------------------
# Using a config file instead of CLI flags lets us set kubeletExtraArgs.
# resolv-conf fix: Ubuntu 22.04 systemd-resolved puts a stub at 127.0.0.53
# that Pods cannot reach. /run/systemd/resolve/resolv.conf is the REAL file
# with actual upstream DNS — kubelet passes this to CoreDNS at init time.
# This is the PROPER fix. No CoreDNS patching needed for external DNS.
- name: Write kubeadm config file
  ansible.builtin.copy:
    dest: /tmp/kubeadm-config.yaml
    content: |
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: ClusterConfiguration
      networking:
        podSubnet: "{{ pod_network_cidr }}"
      ---
      apiVersion: kubeadm.k8s.io/v1beta3
      kind: InitConfiguration
      localAPIEndpoint:
        advertiseAddress: "{{ master_ip }}"
      nodeRegistration:
        name: "{{ inventory_hostname }}"
        kubeletExtraArgs:
          resolv-conf: /run/systemd/resolve/resolv.conf
    mode: "0644"
  when: not kubeadm_init_check.stat.exists

# ---------- 3. Initialize the control plane -----------------------------------
# Now uses --config instead of inline flags.
- name: Run kubeadm init
  ansible.builtin.command: kubeadm init --config /tmp/kubeadm-config.yaml
  when: not kubeadm_init_check.stat.exists
  register: kubeadm_init_result

# ---------- 3b. Patch kube-proxy to use host-only IP (dual-NIC fix) ----------
# kubeadm generates kube-proxy's kubeconfig using the default-route interface
# (10.0.2.15 on Vagrant NAT), not --apiserver-advertise-address. Without this,
# kube-proxy can't reach the API, Flannel crashes, and workers stay NotReady.
- name: Patch kube-proxy ConfigMap to use master_ip
  ansible.builtin.shell: |
    kubectl -n kube-system get cm kube-proxy -o yaml \
      | sed 's|server: https://.*:6443|server: https://{{ master_ip }}:6443|' \
      | kubectl apply -f -
    kubectl -n kube-system rollout restart ds/kube-proxy
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init_check.stat.exists
  changed_when: true

# ---------- 3c. Drop AAAA records in CoreDNS (IPv4-only cluster) -------------
# This cluster has no IPv6 routing (Flannel + Vagrant = IPv4 only).
# When DNS returns AAAA records, Go clients (Kaniko) try IPv6 first and hang.
# Dropping AAAA forces every lookup to IPv4.
#
# NOTE: We no longer patch "forward" here. The resolv-conf fix in kubeadm
# config (step 2) already makes CoreDNS use the correct upstream DNS.
# This task ONLY handles the IPv6 problem.
- name: Patch CoreDNS Corefile (drop AAAA for IPv4-only cluster)
  ansible.builtin.shell: |
    kubectl -n kube-system create configmap coredns \
      --from-literal=Corefile="$(printf '.:53 {\n    errors\n    health {\n       lameduck 5s\n    }\n    ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n       pods insecure\n       fallthrough in-addr.arpa ip6.arpa\n       ttl 30\n    }\n    template ANY AAAA . {\n       rcode NOERROR\n    }\n    prometheus :9153\n    forward . /etc/resolv.conf {\n       max_concurrent 1000\n    }\n    cache 30\n    loop\n    reload\n    loadbalance\n}\n')" \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n kube-system rollout restart deploy/coredns
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: not kubeadm_init_check.stat.exists
  changed_when: true

# ---------- 4. Configure kubectl for the vagrant user -------------------------
- name: Create .kube directory for vagrant user
  ansible.builtin.file:
    path: /home/vagrant/.kube
    state: directory
    owner: vagrant
    group: vagrant
    mode: "0755"

- name: Copy admin.conf to vagrant user's .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/vagrant/.kube/config
    remote_src: true
    owner: vagrant
    group: vagrant
    mode: "0600"

# ---------- 5. Generate and store the join command ----------------------------
- name: Generate cluster join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_result
  changed_when: false

- name: Store join command as a host fact
  ansible.builtin.set_fact:
    kube_join_command: "{{ join_command_result.stdout }}"

# ---------- 6. Debug — print join command (for verification) ------------------
- name: Display join command
  ansible.builtin.debug:
    msg: "{{ kube_join_command }}"