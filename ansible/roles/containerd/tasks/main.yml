# =============================================================================
# Role: containerd — Install and configure the container runtime
# =============================================================================
# Installs containerd, generates a default config, enables SystemdCgroup,
# and ensures the service is running and enabled.
# =============================================================================
---

# ---------- 1. Install containerd --------------------------------------------
- name: Install containerd package
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---------- 2. Ensure config directory exists ---------------------------------
- name: Create /etc/containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------- 3. Generate default containerd config ----------------------------
- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  notify: Restart containerd

# ---------- 4. Enable SystemdCgroup in containerd config ----------------------
- name: Enable SystemdCgroup in containerd config
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup\s*=\s*false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

# ---------- 4b. Set correct sandbox (pause) image for K8s 1.29 ---------------
- name: Set sandbox image to pause:3.9 for Kubernetes 1.29
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'sandbox_image\s*=\s*"registry\.k8s\.io/pause:3\.8"'
    replace: 'sandbox_image = "registry.k8s.io/pause:3.9"'
  notify: Restart containerd

# ---------- 4c. Trust the local Nexus Docker registry over HTTP ---------------
- name: Enable containerd registry hosts directory
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '(^\s*)config_path\s*=\s*""'
    replace: '\1config_path = "/etc/containerd/certs.d"'
  notify: Restart containerd

- name: Create Nexus registry config directory
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ services_ip }}:{{ nexus_docker_port }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure containerd to pull from Nexus registry
  ansible.builtin.copy:
    dest: "/etc/containerd/certs.d/{{ services_ip }}:{{ nexus_docker_port }}/hosts.toml"
    content: |
      server = "http://{{ services_ip }}:{{ nexus_docker_port }}"

      [host."http://{{ services_ip }}:{{ nexus_docker_port }}"]
        capabilities = ["pull", "resolve"]
        skip_verify = true
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

# ---------- 5. Enable and start containerd service ----------------------------
- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
